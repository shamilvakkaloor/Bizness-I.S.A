name: Verify business application
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-only-password
          MYSQL_DATABASE: business_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, pdo_sqlite, xml, zip, gd, bcmath
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: find app bootstrap config database routes tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: composer test
      - name: Run against MySQL
        run: composer test
        env:
          DB_CONNECTION: mysql
          DB_DATABASE: business_test
          DB_HOST: 127.0.0.1
          DB_USERNAME: root
          DB_PASSWORD: test-only-password
      - run: composer audit
